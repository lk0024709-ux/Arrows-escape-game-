name: Build Flutter Game APK

on:
  push:
    branches: [ main ] # ya jo bhi aapka default branch ho
  workflow_dispatch:   # Manual trigger karne ke liye

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Code checkout
      - uses: actions/checkout@v4

      # Step 2: Java setup
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Step 3: Flutter setup
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      # Step 4: Dependencies download
      - name: Install dependencies
        run: flutter pub get

      # Step 5: APK Build
      - name: Build APK
        run: flutter build apk --split-per-abi # release apk ke liye: flutter build apk --release

      # Step 6: APK ko Artifacts me upload karein
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          
