plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.arrows.escape"
    // Keep these values explicit so the project can also be opened directly
    // in Android Studio. Flutter 3.19's stable toolchain supports API 34.
    compileSdk = 34
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    defaultConfig {
        applicationId = "com.arrows.escape"
        // minSdk 21 keeps the widest practical device coverage.
        minSdk = 21
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // Signed with the debug key so `flutter build apk --release`
            // produces an installable APK out of the box. Swap in a real
            // keystore before publishing to the Play Store.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
